client_id = "your_client_id_from_partner_dashboard"
name = "Thrift Collaboration Network"
application_url = "https://your-tunnel-url.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[auth]
redirect_urls = [
  "https://your-tunnel-url.trycloudflare.com/auth/callback"
]

[webhooks]
api_version = "2026-07"

  [webhooks.subscriptions]
  [webhooks.subscriptions.app_uninstalled]
  uri = "/webhooks/app-uninstalled"
  
  [webhooks.subscriptions.products_update]
  uri = "/webhooks/products"
  
  [webhooks.subscriptions.inventory_levels_update]
  uri = "/webhooks/inventory"
  
  [webhooks.subscriptions.orders_create]
  uri = "/webhooks/orders"
  
  [webhooks.subscriptions.orders_update]
  uri = "/webhooks/orders"

[pos]
embedded = false